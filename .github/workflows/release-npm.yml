name: release-npm

# Triggered by the same tag push as release-go.yml and release-pypi.yml,
# but fully self-contained: it builds its own copy of the Go binaries
# (via `goreleaser build`, which only compiles — it does not touch
# GitHub Releases, so it can't collide with release-go.yml running the
# same tag) and then stages + publishes the npm packages.
#
# This is deliberately its own workflow file so that an npm-side failure
# (registry outage, npm's anti-spam scanner flagging a package, a bad
# token, etc.) can never block the Go release or the PyPI publish, and
# vice versa.
#
# Required repository secret:
#   NPM_TOKEN - npm token with publish access (Bypass 2FA enabled for CI)

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Derive version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries with GoReleaser (build-only, no GitHub release)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node .github/scripts/publish-npm.js
