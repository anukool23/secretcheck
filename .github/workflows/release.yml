name: release

# Triggered by pushing a semver tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# This single job:
#   1. Cross-compiles the Go binary for all platforms with GoReleaser and
#      creates a GitHub Release with the archives + checksums.
#   2. Stages and publishes the 5 npm platform packages + the main
#      "secretcheck" npm package (optionalDependencies pattern).
#   3. Builds all 5 PyPI platform wheels from the same GoReleaser binaries
#      and uploads them with twine.
#
# Nothing here compiles native code per-platform for npm/PyPI — it only
# repackages the Go binaries GoReleaser already cross-compiled, so it all
# runs on a single ubuntu-latest runner.
#
# Required repository secrets:
#   NPM_TOKEN       - npm automation token with publish access
#   PYPI_API_TOKEN  - PyPI API token (scoped to this project) for twine
# GITHUB_TOKEN is provided automatically by Actions.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Go tests
        run: go test ./...

      - name: Derive version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node .github/scripts/publish-npm.js

      - name: Build PyPI wheels
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          sed -i "s/^version = .*/version = \"${VERSION}\"/" packaging/pypi/pyproject.toml
          cd packaging/pypi
          ./build_wheels.sh

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload packaging/pypi/wheelhouse/*.whl
